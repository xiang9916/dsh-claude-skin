# dsh-claude-skin bundle patch: inserts its dsh.client row into the web plugin roster.
# The row id is fork-specific (ui-claude-skin) so it can never collide with
# the upstream @pakiknowledge/dsh-client-ui-skin-claude row (ui-skin-claude).
# Only one skin should be enabled at a time: two skins both write the same
# body scope + style layer, so enable this one or the upstream one, not both.
# Install with `dsh plugin --profile <name> add <path-or-git-url>`.
- insert:
    - id: ui-claude-skin
      name: 'dsh-claude-skin'
